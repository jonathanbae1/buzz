name: Fork desktop artifacts

# Forks cannot use the upstream Apple signing, notarization, or release
# credentials. This workflow builds unsigned installers and stores them as
# Actions artifacts only; it never creates a GitHub Release or updater feed.
# The upstream release workflow remains restricted to block/buzz.

on:
  workflow_dispatch: {}
  push:
    tags: ["fork-desktop-v[0-9]*"]

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.platform }} desktop artifact
    if: github.repository != 'block/buzz'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: macos-arm64
          - platform: Linux x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact: linux-x64
          - platform: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            squashfs-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Install desktop dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build Unix sidecars
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --release --target "$TARGET" \
            -p buzz-acp \
            -p buzz-agent \
            -p buzz-backend-kubernetes \
            -p buzz-dev-mcp \
            -p git-credential-nostr \
            -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build Windows sidecars
        if: runner.os == 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --release --target "$TARGET" \
            -p buzz-acp \
            -p buzz-agent \
            -p buzz-dev-mcp \
            -p git-credential-nostr \
            -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Generate fork bundle config
        shell: bash
        run: |
          cat > desktop/src-tauri/tauri.fork.conf.json <<'JSON'
          {
            "bundle": {
              "createUpdaterArtifacts": false,
              "macOS": {
                "minimumSystemVersion": "10.15"
              }
            },
            "plugins": {
              "updater": {
                "endpoints": []
              }
            }
          }
          JSON

      - name: Build unsigned desktop bundle
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          set -euo pipefail
          cd desktop
          pnpm tauri build --verbose --no-sign --target "$TARGET" \
            --bundles "$BUNDLES" \
            --config src-tauri/tauri.fork.conf.json

      - name: Upload unsigned desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buzz-fork-${{ matrix.artifact }}-${{ github.sha }}
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          if-no-files-found: error
          retention-days: 7
